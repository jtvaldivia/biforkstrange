[project]
name = "{{cookiecutter.project_slug}}-backend"
version = "0.1.0"
requires-python = ">={{cookiecutter.python_version}}"
dependencies = [
  "fastapi[standard]>=0.115",
  "numpy>=2.0",
  "pydantic-settings>=2.4",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3.6", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
