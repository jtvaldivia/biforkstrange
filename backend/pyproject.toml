[project]
name = "platanus-hack-26-cl-team-32-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=2.12",
  "fastapi[standard]>=0.115",
  "numpy>=2.0",
  "pydantic-settings>=2.4",
  "pypdf>=5",
  "supabase>=2.9",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
